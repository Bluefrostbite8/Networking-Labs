<text x="640" y="762" class="lgh">NOTES</text>
<text x="640" y="778" class="lg">• Rapid-PVST: STP root = HSRP active per VLAN</text>
<text x="640" y="790" class="lg">• EtherChannel: Po1 LACP · Po2 PAgP · Po3 static "on"</text>
<text x="640" y="802" class="lg">• HSRP load-share: Core1 = VLAN 10/30, Core2 = VLAN 20</text>
<text x="640" y="814" class="lg">• Access ports: port-security (sticky) + PortFast/BPDU Guard</text>
<text x="640" y="826" class="lg">• Every access switch dual-homed to both distribution switches</text>
