id: sec-portsec-mac
title: Port security locked to an address no host owns
category: security
tier: 2
mode: static
platforms: [iosvl2]
selftest_passed: []                       # labs where selftest passed; break draws only these
applies_when:
  - feature: access
  - dhcp_hosts: true

inject:
  target: portsec_max1_host_port          # host ports with port security at the default maximum of 1
  node_var: switch
  action: portsec_bogus_mac               # a configured secure MAC fills the only slot
  save: true

ticket:
  t1: "{host} on {switch} {iface_short} has link but gets no address."
  t2: "{host} can't get on the network. The cable and the port lights look fine."
  t3: "One user can't connect since last night's change window."

hints:
  h1: "The host has link, so ask what the switch is willing to accept on that port."
  h2: "Check port security on {switch} {iface_short}."
  h3: "Run 'show port-security address' and 'show port-security interface {iface_short}' on {switch}."

checks:
  refresh: ["{host}"]
  functional:
    - host_lease: { on: "{host}", subnet: "{subnet}", wait_s: 90 }
    - ping: { from: "{host}", to: ["{gateway}"], onlink: true }
  root_cause:
    - cli_match: { on: "{switch}", command: "show port-security address", pattern: '{bad_mac}', expect: false, label: "configured secure MAC {bad_mac}" }
  intent: []
  workaround_signatures:
    - cli_match: { on: "{switch}", command: "show port-security interface {iface}", pattern: 'Maximum MAC Addresses\s*:\s*([2-9]|\d\d)', label: "port-security maximum raised" }

reference_fix: |
  interface {iface}
   no switchport port-security mac-address {bad_mac}

selftest:
  reinject:                               # the host's sticky MAC fills the slot after the fix: flush it first
    "{switch}": "interface {iface}\n shutdown\n no switchport port-security mac-address sticky\n switchport port-security mac-address {bad_mac}\n switchport port-security mac-address sticky\n no shutdown"
  workaround:
    "{switch}": "interface {iface}\n switchport port-security maximum 2"
  workaround_saved: false

debrief:
  scope: "One host ({host}); the port is up, but the switch drops its frames"
  methods: [bottom_up, follow_the_path]
  reasoning: >
    Link is up and nothing else on the switch is wrong, so the problem sits on this
    one port. Port security allows one address there, and a configured secure MAC
    that belongs to no host already takes that slot: every frame from {host} is a
    violation, so its DHCP request never leaves the port. Restrict mode drops the
    frames without shutting the port, which is why the lights look healthy.
  commands:
    show: ["show port-security address", "show port-security interface {iface}",
           "show running-config interface {iface}", "show mac address-table interface {iface}"]
    debug: ["debug port-security (shows the violations as {host} retries DHCP)"]
  key_clue: "show port-security address on {switch}: a configured secure address '{bad_mac}' on {iface_short} that no host owns"
  better_fix_if_temporary: "Remove the configured address instead of raising the maximum, then save with 'write memory' on {switch}."
