id: fhrp-priority-flip
title: HSRP active on the wrong switch
category: fhrp
tier: 2
mode: static
platforms: [iosvl2, iosv, iol-xe]
selftest_passed: ["03"]                   # labs where selftest passed; break draws only these
applies_when:
  - feature: hsrp
  - profile_intent: hsrp_active

inject:
  target: hsrp_design_active              # VLANs whose active router the profile fixes
  node_var: node
  action: hsrp_priority_flip              # design active below its peer; peer gets preempt
  save: true

ticket:
  t1: "{peer} is the active HSRP gateway for VLAN {vlan}; the design says {node}."
  t2: "Monitoring shows VLAN {vlan} traffic leaving through a different first hop than the design."
  t3: "One of the core switches has been working harder than the other since last night's change window."

hints:
  h1: "This is a first-hop redundancy question: who is the gateway for VLAN {vlan}, and why?"
  h2: "Compare the HSRP group for VLAN {vlan} on {node} and {peer}."
  h3: "Run 'show standby {svi}' on both and compare priority and preempt."

checks:
  functional:
    - hsrp_state: { on: "{node}", vlan: "{vlan}", state: Active, wait_s: 60 }
  root_cause:
    - hsrp_priority_above: { on: "{node}", peer: "{peer}", vlan: "{vlan}" }
  intent: [hsrp_active]
  workaround_signatures:
    - interface_state: { on: "{peer}", interface: "{svi}", state: admin-down }   # peer forced out instead

reference_fix:
  "{node}": "interface {svi}\n standby {group} priority {priority}"
  "{peer}": "interface {svi}\n no standby {group} preempt"

selftest:
  reinject:
    "{node}": "interface {svi}\n standby {group} priority {bad_priority}"
    "{peer}": "interface {svi}\n standby {group} preempt"
  workaround:
    "{peer}": "interface {svi}\n shutdown"
  workaround_saved: false

debrief:
  methods: [compare_known_good, follow_the_path]
  reasoning: >
    Users still have a gateway, so this is not an outage: HSRP elected the other
    router. The question is why the design active lost the election, so compare
    priority and preempt on both peers. Two changes work together here: the design
    active's priority dropped below its peer's, and the peer gained preempt, so it
    takes over even when it comes up second.
  commands:
    show: ["show standby brief", "show standby {svi}", "show running-config interface {svi}"]
    debug: ["debug standby events"]
  # Verified on lab 03 (selftest 2026-10-12), show standby {svi} on {node} in the broken state:
  key_clue: "show standby {svi} on {node}: 'Active router is {peer_ip}, priority {peer_priority}' while its own line reads 'Priority {bad_priority} (configured {bad_priority})'"
  better_fix_if_temporary: "Bring {peer}'s SVI back up, restore priority {priority} on {node} and remove the added preempt on {peer}."
