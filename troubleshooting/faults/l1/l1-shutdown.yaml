id: l1-shutdown
title: Host-facing switch port administratively down
category: l1
tier: 1                                   # lowest tier it can appear in
mode: static                              # shutdown written into the imported config
platforms: [iosvl2]
selftest_passed: ["03"]                   # labs where selftest passed; break draws only these
applies_when:
  - feature: access
  - dhcp_hosts: true

inject:
  target: host_access_port                # a host cabled to a switch access port with a gateway
  node_var: switch
  action: shutdown
  save: true

ticket:
  t1: "{host} has no network connection. It plugs into {switch} {iface_short}."
  t2: "{host} lost its network connection this morning. Nobody else on the floor is affected."
  t3: "One of the desktops can't get on the network."

hints:                                    # unlocked strictly in order
  h1: "Start at Layer 1: does the port {host} plugs into have link?"
  h2: "Look at the access port on {switch} that {host} is cabled to, {iface_short}."
  h3: "Run 'show interfaces {iface_short} status' on {switch} and read the Status column."

checks:
  refresh: ["{host}"]                     # the grader restarts the host so it asks DHCP again
  functional:                             # does traffic work?
    - host_lease: { on: "{host}", subnet: "{subnet}", wait_s: 90 }
    - ping: { from: "{host}", to: ["{gateway}"] }
  root_cause:                             # is the cause gone? state, not text
    - interface_state: { on: "{switch}", interface: "{iface}", state: up }
  intent: []
  workaround_signatures:
    - unsaved_fix: true                   # no real workaround exists; Temporary = fixed but not saved

reference_fix: |
  interface {iface}
   no shutdown

selftest:
  reinject:
    "{switch}": "interface {iface}\n shutdown"
  workaround:
    "{switch}": "interface {iface}\n no shutdown"
  workaround_saved: false

debrief:
  scope: "One host ({host}) is down; every other host works, so the fault is on its own path"   # Where to look: who and what is affected
  methods: [bottom_up, follow_the_path]
  reasoning: >
    One host is down and the others are fine, so the problem sits on that host's own
    path. Working bottom-up from Layer 1, the switch reports the port as
    administratively down: a configured state, not a cable or speed fault, so the
    fix is on the switch, not the host.
  commands:
    show: ["show interfaces {iface_short} status", "show interfaces {iface}",
           "show running-config interface {iface}", "show port-security interface {iface}"]
    debug: ["debug ip dhcp server events (on the DHCP server: no DISCOVER ever arrives from {host})"]
  # Verified on lab 03 (selftest 2026-10-12), A3 in the broken state:
  key_clue: "show interfaces {iface} on {switch}: '{iface} is administratively down, line protocol is down (disabled)'; 'show interfaces {iface_short} status' lists the port as disabled"
  better_fix_if_temporary: "Save the fix: 'write memory' on {switch}, or the port is down again after a reload."
