id: svc-helper-wrong
title: DHCP relays point at an address nobody answers
category: services
tier: 2
mode: static
platforms: [iosvl2, iosv, iol-xe]
selftest_passed: []                       # labs where selftest passed; break draws only these
applies_when:
  - feature: dhcp_server
  - dhcp_hosts: true

inject:
  target: vlan_relays                     # a VLAN relayed by two SVIs, one helper each
  node_var: relay_a
  action: wrong_helpers                   # every relay of the VLAN points at an unused excluded address
  save: true

ticket:
  t1: "Hosts in VLAN {vlan} get no DHCP address. {server} serves pool {pool} and is up."
  t2: "Nobody on the VLAN {vlan} floor can get on the network this morning."
  t3: "Several users can't connect; others are fine."

hints:
  h1: "The hosts never get an address, so follow the DHCP request: who forwards it off the VLAN?"
  h2: "Check the DHCP relay on the VLAN {vlan} gateways, {relay_a} and {relay_b}."
  h3: "Run 'show ip interface {svi}' on {relay_a} and {relay_b} and read the Helper address line."

checks:
  refresh: ["{host}"]
  functional:
    - host_lease: { on: "{host}", subnet: "{subnet}", wait_s: 90 }
    - ping: { from: "{host}", to: ["{server_ip}"] }
  root_cause:                             # every relay must point at the DHCP server again
    - cli_match: { on: "{relays}", command: "show ip interface {svi}", pattern: 'Helper address is ({server_ips_regex})\s*$', label: "DHCP relay on {svi}" }
  intent: []
  workaround_signatures:
    - unsaved_fix: true

reference_fix:
  "{relay_a}": "interface {svi}\n no ip helper-address {bad_helper}\n ip helper-address {helper_a}"
  "{relay_b}": "interface {svi}\n no ip helper-address {bad_helper}\n ip helper-address {helper_b}"

selftest:
  reinject:
    "{relay_a}": "interface {svi}\n no ip helper-address {helper_a}\n ip helper-address {bad_helper}"
    "{relay_b}": "interface {svi}\n no ip helper-address {helper_b}\n ip helper-address {bad_helper}"
  workaround:
    "{relay_a}": "interface {svi}\n no ip helper-address {bad_helper}\n ip helper-address {helper_a}"
    "{relay_b}": "interface {svi}\n no ip helper-address {bad_helper}\n ip helper-address {helper_b}"
  workaround_saved: false

debrief:
  scope: "Every host in VLAN {vlan}: no address at all, other VLANs fine"
  methods: [follow_the_path, compare_known_good]
  reasoning: >
    Only one VLAN is affected and its hosts get no address at all, so DHCP never
    completes. The server sits on another subnet, so each DISCOVER depends on the
    VLAN's gateways relaying it. Both relays point at {bad_helper}, an address inside
    the VLAN that no device owns, so the requests go nowhere. Compare with a VLAN
    that works: its helper is the server's address.
  commands:
    show: ["show ip interface {svi}", "show running-config interface {svi}", "show ip interface brief",
           "show standby brief"]
    debug: ["debug ip dhcp server packet (on {server}: no DISCOVER arrives from VLAN {vlan})"]
  key_clue: "show ip interface {svi} on {relay_a}: 'Helper address is {bad_helper}' where the server is {helper_a}"
  better_fix_if_temporary: "Point both relays back at the DHCP server and save with 'write memory' on {relay_a} and {relay_b}."
