id: l2-access-vlan
title: Host port in the wrong access VLAN
category: l2
tier: 1
mode: static
platforms: [iosvl2]
selftest_passed: ["03"]                   # re-proven with the on-link ping 2026-10-12; break draws only these
applies_when:
  - feature: access
  - dhcp_hosts: true

inject:
  target: host_access_port
  node_var: switch
  action: change_access_vlan              # another VLAN of this lab that has a gateway
  save: true

ticket:
  t1: "{host} on {switch} {iface_short} gets an address in {bad_subnet} instead of its own subnet {subnet}."
  t2: "{host} is online, but it's sitting in the wrong department's network."
  t3: "A user says their PC 'isn't on the right network' since this morning."

hints:
  h1: "Layer 2: the host has link and an address, so which VLAN is its port in?"
  h2: "Check the access port on {switch} that {host} uses."
  h3: "Run 'show interfaces {iface_short} switchport' on {switch} and compare Access Mode VLAN with the design."

checks:
  refresh: ["{host}"]
  functional:
    - host_lease: { on: "{host}", subnet: "{subnet}", wait_s: 90 }
    - ping: { from: "{host}", to: ["{gateway}"], onlink: true }   # routed from a wrong VLAN, so on-link only
  root_cause:
    - access_vlan: { on: "{switch}", interface: "{iface}", vlan: "{vlan}" }
  intent: []
  workaround_signatures:
    - unsaved_fix: true

reference_fix: |
  interface {iface}
   switchport access vlan {vlan}

selftest:
  reinject:
    "{switch}": "interface {iface}\n switchport access vlan {bad_vlan}"
  workaround:
    "{switch}": "interface {iface}\n switchport access vlan {vlan}"
  workaround_saved: false

debrief:
  scope: "One host ({host}) has an address, but from the wrong subnet"   # Where to look: who and what is affected
  methods: [follow_the_path, compare_known_good]
  reasoning: >
    The host leases an address, so DHCP, the relay and routing all work. The address
    comes from another VLAN's pool, which means the port drops the host into the
    wrong broadcast domain. Comparing the port with the design, or with a working
    host port, shows the access VLAN differs.
  commands:
    show: ["show interfaces {iface_short} switchport", "show vlan brief",
           "show mac address-table interface {iface_short}", "show running-config interface {iface}"]
    debug: ["debug ip dhcp server packet (on the DHCP server: the DISCOVER arrives via the VLAN {bad_vlan} relay address)"]
  # Verified on lab 03 (selftest 2026-10-12), A3 in the broken state ('Access Mode VLAN: 30 (Service)'):
  key_clue: "show interfaces {iface_short} switchport on {switch}: 'Access Mode VLAN: {bad_vlan}' where the design says {vlan}"
  better_fix_if_temporary: "Save the fix with 'write memory' on {switch}."
